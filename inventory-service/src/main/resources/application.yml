server:
  port: 8082

spring:
  application:
    name: inventory-service
  
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.4:8848
  
  datasource:
    url: jdbc:postgresql://192.168.1.4:5432/order_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

rocketmq:
  endpoints: 192.168.1.4:8081
  consumer:
    group: inventory-consumer-group

logging:
  level:
    com.hyxiao.inventory: INFO