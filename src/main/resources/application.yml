spring:
  application:
    name: order-system
  
  # PostgreSQL 数据库配置
  datasource:
    url: jdbc:postgresql://192.168.1.4:5432/order_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8088

# RocketMQ 配置
rocketmq:
  # 尝试使用传统的 Name Server 端口
  endpoints: 192.168.1.4:8081
  consumer:
    group: order-consumer-group
  producer:
    group: order-producer-group
    
# 日志配置
logging:
  level:
    com.hyxiao.ordersystem: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG