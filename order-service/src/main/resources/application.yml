server:
  port: 9091

spring:
  application:
    name: order-service
  
  # Nacos配置
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.4:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: 192.168.1.4:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml
        import-check:
          enabled: false
  
  # PostgreSQL 数据库配置
  datasource:
    url: jdbc:postgresql://192.168.1.4:5432/order_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# 消息配置
hyxiao:
  message:
    enabled: true
    rocketmq:
      endpoints: 192.168.1.4:8081
    producer:
      group: order-producer-group
    consumer:
      group: order-consumer-group

# 日志配置
logging:
  level:
    com.hyxiao.ordersystem: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always