server:
  port: 8086

spring:
  application:
    name: procurement-service
  
  datasource:
    url: jdbc:postgresql://192.168.1.4:5432/order_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.4:8848

# 消息配置
hyxiao:
  message:
    enabled: true
    rocketmq:
      endpoints: 192.168.1.4:8081
    producer:
      group: procurement-producer-group
    consumer:
      group: procurement-service-group

# 日志配置
logging:
  level:
    com.hyxiao: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always