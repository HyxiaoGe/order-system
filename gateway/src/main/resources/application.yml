server:
  port: 9090

spring:
  application:
    name: gateway
  
  # Nacos配置
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.4:8848
        namespace: public
        group: DEFAULT_GROUP
    
    # Gateway路由配置
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
    
    # 负载均衡配置
    loadbalancer:
      ribbon:
        enabled: false

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always